<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <div class="navbar">
            <h1>Personal Expense Tracker</h1>
        </div>
    </header>

    <main class="container">
        <!-- Dashboard Summary -->
        <section class="dashboard-header">
            <h2>Financial Dashboard</h2>
            <p>Manage your income and expenses in one place.</p>
        </section>

        <section class="summary-cards">
            <div class="card">
                <h3>Total Income</h3>
                <p id="total-income">LKR 0.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="total-expenses">LKR 0.00</p>
            </div>
            <div class="card">
                <h3>Current Balance</h3>
                <p id="current-balance">LKR 0.00</p>
            </div>
        </section>

        <!-- Transaction Form -->
        <section class="form-section">
            <h3>Add a Transaction</h3>
            <form id="transaction-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="type">Transaction Type</label>
                        <select id="type" required>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g. Monthly allowance" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (LKR)</label>
                        <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Allowance">Allowance</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Transaction Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Add Transaction</button>
                    <button type="button" id="clear-btn" class="btn-secondary">Clear Form</button>
                </div>
            </form>
        </section>

        <!-- Transaction History -->
        <section class="history-section">
            <h3>Transaction History</h3>
            <div class="filters">
                <div class="filter-group">
                    <label for="filter-type">Filter by Type</label>
                    <select id="filter-type">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="search">Search Transactions</label>
                    <input type="text" id="search" placeholder="Search by description or category">
                </div>
            </div>

            <div class="table-container">
                <table id="transaction-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Amount (LKR)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list">
                        <!-- Transactions will be injected here via JS -->
                    </tbody>
                </table>
            </div>
            <p id="no-transactions" class="no-data" style="display: none;">No transactions found.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
